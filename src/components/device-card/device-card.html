<!-- 1. Link your CSS file relative to where app.html lives -->
<link rel="stylesheet" href="src/components/device-card/device-card.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&" />

<div class="paper-card">
    <!-- Top row containing two action/status icons -->
    <div class="card-top-row">
        <!-- Standard AC/Cooling Symbol (Recommended) -->
        <span class="material-symbols-outlined">{{_data.icon}}</span>
        <!-- Standard Power Icon -->
        <span class="material-icons material-symbols-outlined power-icon">power_settings_new</span>
    </div>

    <!-- Bottom block containing the 2-line textual description -->
    <div class="card-bottom-info">
        <div class="text-line-main">{{_data.name}}</div>
        <div class="text-line-sub">Consuming 1.2 kWh</div>
    </div>
</div>
